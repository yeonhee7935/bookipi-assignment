worker_processes auto;

events {
  worker_connections 8192;
}

http {
  include /etc/nginx/mime.types;
  access_log off;

  # Docker DNS returns every `api` replica; nginx round-robins across them.
  # max_fails=0: a replica that is slow under load is never taken out of rotation.
  # With the default (1 failure → out for 10 s), a burst that slows every replica
  # leaves no live upstream and nginx rejects all traffic with 502 for 10 s.
  # A crashed replica refuses connections, and proxy_next_upstream retries elsewhere.
  upstream api {
    server api:3000 max_fails=0;
    keepalive 128;
  }

  # Micro-cache for the status endpoint, which every open page polls.
  proxy_cache_path /var/cache/nginx/api levels=1 keys_zone=sale_status:1m max_size=10m inactive=10s;

  server {
    listen 80;
    root /usr/share/nginx/html;

    # Every open sale page polls this. With a 1 s cache, Redis sees about one status read
    # per second per nginx worker however many people are watching. Purchases are never
    # cached, so this only delays the displayed stock count, not who gets an item.
    location = /api/sale {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_cache sale_status;
      proxy_cache_valid 200 1s;
      proxy_cache_lock on;              # concurrent misses wait for one upstream fetch
      proxy_cache_use_stale updating;   # serve the previous copy while refreshing
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # A request that could not reach a replica (crashed / restarting) is sent to
      # another one. nginx never replays a POST that was already delivered, so a
      # purchase is never executed twice by the proxy.
      proxy_next_upstream error timeout;
      proxy_connect_timeout 1s;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
